syntax = "proto3";

option java_package = "com.customDB.protobuf";
option java_outer_classname = "RecordOuterClass";

message Record {
  int64 id = 1;
  string invoiceNo = 2;
  string stockCode = 3;
  string description = 4;
  int64 quantity = 5;
  string invoiceDate = 6;
  double unitPrice = 7;
  string customerID = 8;
  string country = 9;
}
